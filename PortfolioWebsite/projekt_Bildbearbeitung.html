<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt Bildbearbeitung</title>

    <!-- Lädt das Bootstrap-Framework für fertige Styles und Komponenten wie Buttons, Karten etc. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Verbindung zu Google Fonts wird vorbereitet (schnelleres Laden) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Lädt die Schriftart "Raleway" in verschiedenen Schriftstärken von Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bindet die eigene CSS-Datei ein, die alle benutzerdefinierten Styles enthält -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===================== NAVIGATIONSLEISTE ===================== -->
    <!-- Identisch auf allen Seiten – sorgt für ein einheitliches Erscheinungsbild -->
    <nav class="navbar navbar-expand-lg navbar-dark island-nav py-2">
        <div class="container">

            <!-- Logo / Name links oben -->
            <a class="navbar-brand fw-bold fs-4 text-white ps-lg-2" href="index.html">David Cernusca</a>

            <!-- Hamburger-Button: erscheint nur auf kleinen Bildschirmen (Mobilgeräte) -->
            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigationslinks – auf Mobilgeräten eingeklappt, auf Desktop sichtbar -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- "ms-auto" schiebt die Links nach rechts -->
                <ul class="navbar-nav ms-auto mt-2 mt-lg-0 pe-lg-2">
                    <li class="nav-item">
                        <a class="nav-link fs-6 px-3" href="#">Fähigkeiten</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-6 px-3" href="projekte.html">Projekte</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>


    <!-- ===================== HAUPTINHALT ===================== -->
    <!-- "mt-5" sorgt für einen größeren Abstand nach oben, damit der Inhalt Luft hat -->
    <div class="container px-4 px-md-0 mt-5">
        <div class="row justify-content-center mb-5">
            <div class="col-sm-10 col-md-10 col-lg-8">

                <!-- Detailkarte des Projekts im einheitlichen Design -->
                <div class="project-section p-4 p-md-5 text-start">

                    <!-- Zurück-Link zur Projektübersicht -->
                    <!-- "d-inline-flex" und "align-items-center" richten Pfeil und Text nebeneinander aus -->
                    <a href="projekte.html" class="nav-link d-inline-flex align-items-center gap-2 mb-4 text-secondary fs-6">
                        <!-- SVG-Pfeil-Icon (zeigt nach links) -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
                        </svg>
                        Zurück zur Übersicht
                    </a>

                    <!-- Projektüberschrift – "border-bottom" erzeugt die Trennlinie darunter -->
                    <h2 class="fw-bold mb-4 text-white border-bottom border-secondary pb-3">
                        Selbstgeeditedes Bild
                    </h2>

                    <!-- Projektbeschreibung – "text-white-50" macht den Text etwas transparenter -->
                    <!-- "lh-base" sorgt für einen angenehmen Zeilenabstand beim Lesen -->
                    <p class="text-white-50 fs-5 lh-base">
                        Ein Vogel+Boot auf eine Hintergrund geedited.
                    </p>

                </div>

            </div>
        </div>
    </div>


    <!-- ===================== FUSSZEILE ===================== -->
    <footer class="island-footer py-3 text-white">
        <div class="container text-center">

            <!-- Links nebeneinander, zentriert, mit gleichmäßigem Abstand (gap-4) -->
            <div class="d-flex justify-content-center align-items-center gap-4 fs-6">

                <a href="#" class="footer-link">Impressum</a>
                <a href="#" class="footer-link">Kontakt</a>

                <!-- GitHub-Icon als SVG – öffnet in einem neuen Tab (target="_blank") -->
                <!-- "aria-label" macht den Link für Screenreader zugänglich -->
                <a href="https://github.com" class="github-hover d-flex align-items-center" target="_blank" aria-label="GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
                    </svg>
                </a>

            </div>
        </div>
    </footer>

    <!-- Lädt das Bootstrap-JavaScript (muss am Ende stehen, damit das HTML zuerst geladen wird) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
