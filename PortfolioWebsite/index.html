<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <!-- Lädt das Bootstrap-Framework für fertige Styles und Komponenten wie Buttons, Karten etc. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Verbindung zu Google Fonts wird vorbereitet (schnelleres Laden) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Lädt die Schriftart "Raleway" in verschiedenen Schriftstärken von Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bindet die eigene CSS-Datei ein, die alle benutzerdefinierten Styles enthält -->
    <link rel="stylesheet" href="style.css">

    <!-- Lädt das Bootstrap-JavaScript (defer = erst nach dem HTML laden) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body>

    <!-- ===================== NAVIGATIONSLEISTE ===================== -->
    <!-- "navbar-expand-lg" bedeutet: ab großen Bildschirmen wird die Nav horizontal angezeigt -->
    <!-- "navbar-dark" passt die Textfarben für dunkle Hintergründe an -->
    <nav class="navbar navbar-expand-lg navbar-dark island-nav py-2">
        <div class="container">

            <!-- Logo / Name links oben -->
            <a class="navbar-brand fw-bold fs-4 text-white ps-lg-2" href="#">David Cernusca</a>

            <!-- Hamburger-Button: erscheint nur auf kleinen Bildschirmen (Mobilgeräte) -->
            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigationslinks – auf Mobilgeräten eingeklappt, auf Desktop sichtbar -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- "ms-auto" schiebt die Links nach rechts -->
                <ul class="navbar-nav ms-auto mt-2 mt-lg-0 pe-lg-2">
                    <li class="nav-item">
                        <a class="nav-link fs-6 px-3" href="#">Fähigkeiten</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-6 px-3" href="projekte.html">Projekte</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>


    <!-- ===================== HAUPTINHALT ===================== -->
    <!-- "container" begrenzt die Breite und zentriert den Inhalt -->
    <div class="container px-4 px-md-0 mt-2">


        <!-- ---- KARTEN-BEREICH (zwei nebeneinander) ---- -->
        <!-- "row" erstellt eine horizontale Zeile im Bootstrap-Rastersystem -->
        <!-- "g-4" setzt den Abstand zwischen den Karten -->
        <div class="row justify-content-center mb-4 g-4">

            <!-- Karte: Lebenslauf -->
            <!-- "col-sm-10 col-md-5 col-lg-4" steuert die Breite je nach Bildschirmgröße -->
            <div class="col-sm-10 col-md-5 col-lg-4">
                <div class="card h-100 bg-custom-card overflow-hidden">

                    <!-- Bereich für das dekorative SVG-Icon -->
                    <div class="icon-container">
                        <!-- SVG-Grafik: stellt ein Dokument/Blatt dar -->
                        <svg class="card-icon" xmlns="http://www.w3.org/2000/svg" width="65" height="65" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line> 
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                    </div>

                    <!-- Karteninhalt: enthält den Button -->
                    <div class="card-body p-4 pt-0">
                        <a href="#" class="btn btn-custom-gradient py-3 rounded-3 fs-5">Lebenslauf</a>
                    </div>

                </div>
            </div>

            <!-- Karte: Ziele -->
            <div class="col-sm-10 col-md-5 col-lg-4">
                <div class="card h-100 bg-custom-card overflow-hidden">

                    <!-- Bereich für das dekorative SVG-Icon -->
                    <div class="icon-container">
                        <!-- SVG-Grafik: stellt ein Zielscheiben-Symbol dar -->
                        <svg class="card-icon" xmlns="http://www.w3.org/2000/svg" width="65" height="65" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="12" r="6"></circle>
                            <circle cx="12" cy="12" r="2"></circle>
                            <line x1="22" y1="12" x2="18" y2="12"></line>
                            <line x1="6" y1="12" x2="2" y2="12"></line>
                            <line x1="12" y1="6" x2="12" y2="2"></line>
                            <line x1="12" y1="22" x2="12" y2="18"></line>
                        </svg>
                    </div>

                    <!-- Karteninhalt: enthält den Button -->
                    <div class="card-body p-4 pt-0">
                        <a href="#" class="btn btn-custom-gradient py-3 rounded-3 fs-5">Ziele</a>
                    </div>

                </div>
            </div>

        </div>


        <!-- ---- PROJEKT-BANNER ---- -->
        <!-- Zeigt das neueste Projekt als hervorgehobenen Bereich an -->
        <div class="row justify-content-center mb-5 pt-2">
            <div class="col-sm-10 col-md-10 col-lg-8">
                <div class="project-section p-4 p-md-5 text-center">

                    <h3 class="fw-bold mb-4 text-white">Mein letztes Projekt</h3>

                    <!-- Klickbarer Bereich, der zum Projekt weiterleitet -->
                    <a href="#" class="project-inner-btn shadow-sm">
                        <h4 class="fw-bold mb-0">Beispielprojekt</h4>
                    </a>

                </div>
            </div>
        </div>


    </div>


    <!-- ===================== FUSSZEILE ===================== -->
    <footer class="island-footer py-3 text-white">
        <div class="container text-center">

            <!-- Links nebeneinander, zentriert, mit gleichmäßigem Abstand (gap-4) -->
            <div class="d-flex justify-content-center align-items-center gap-4 fs-6">

                <a href="#" class="footer-link">Impressum</a>
                <a href="#" class="footer-link">Kontakt</a>

                <!-- GitHub-Icon als SVG – öffnet in einem neuen Tab (target="_blank") -->
                <!-- "aria-label" macht den Link für Screenreader zugänglich -->
                <a href="https://github.com" class="github-hover d-flex align-items-center" target="_blank" aria-label="GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
                    </svg>
                </a>

            </div>
        </div>
    </footer>

</body>
</html>
